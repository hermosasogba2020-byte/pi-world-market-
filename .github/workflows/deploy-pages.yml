# 1. Clonez le dépôt (si ce n'est pas fait)
git clone https://github.com/hermosasogba2020-byte/pi-world-market-.git
cd pi-world-market-

# 2. Créez le dossier s'il n'existe pas
mkdir -p .github/workflows

# 3. Créez le fichier
cat > .github/workflows/deploy-pages.yml << 'EOF'
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
EOF

# 4. Ajoutez et committez
git add .github/workflows/deploy-pages.yml
git commit -m "Add GitHub Pages deployment workflow"
git push origin main
